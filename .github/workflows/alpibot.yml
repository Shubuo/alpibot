name: AlpiBot Auto Tweet

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 7 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt
      - name: AlpiBot çalıştır
        env:
          # Hem secrets hem vars (Variables) dene, hangisi doluysa onu al
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          GOOGLE_AI_API_KEY:  ${{ secrets.GOOGLE_AI_API_KEY || vars.GOOGLE_AI_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY || vars.BALLDONTLIE_API_KEY }}
        run: python main.py
